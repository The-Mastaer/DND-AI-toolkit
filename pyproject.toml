# pyproject.toml (Corrected and Consolidated)

[project]
name = "dnd_ai_toolkit"
version = "1.18.00"
description = "An intelligent Campaign Co-Pilot for Dungeons & Dragons Dungeon Masters."
authors = [
    { name = "The_Mastaer", email = "mastilak.ondrej@gmail.com" },
]
dependencies = [
    "flet",
    "supabase",
    "google-genai",
    "python-dotenv"
]
requires-python = ">=3.9"

[tool.flet]
assets_dir = "src/assets"

[tool.flet.app]
path = "src"